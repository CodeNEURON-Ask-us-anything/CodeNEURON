<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeNeuron — AI Fact Verification & Code Analysis</title>
    <meta name="description" content="Paste any factual claim or code snippet and get instant, grounded verification with source links.">
    <link rel="stylesheet" href="index.css?v=13">
    <!-- Markdown Parser -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <!-- Top Navigation -->
    <header class="app-header">
        <div class="brand">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            CodeNeuron
        </div>
        <div class="model-selector">
            <button id="btn-new-chat" class="input-outline" style="cursor: pointer; background: var(--bg-hover); color: var(--text-primary); font-weight: 500;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align: middle; margin-right: 4px;"><path d="M12 5v14M5 12h14"/></svg>New Chat
            </button>
            <select id="verification-mode" class="input-outline">
                <option value="gemini" selected>Grounded Gemini</option>
                <option value="nli">Local NLI</option>
            </select>
            <input type="password" id="gemini-api-key" class="input-outline" placeholder="API Key" style="width: 140px;">
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="main-container" id="main-scroll">
        <div class="chat-container" id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <h1>What can I verify for you?</h1>
                <p>Paste a factual claim, ask a question, or submit code. I'll verify it instantly against live web sources and give you a credibility score with links.</p>
            </div>
        </div>
    </main>

    <!-- Bottom Input Bar -->
    <div class="input-container">
        <div class="input-wrapper">
            <textarea id="prompt-input" rows="1" placeholder="Ask anything, verify a claim, or paste code..."></textarea>
            <div class="input-actions">
                <button class="btn-submit" id="btn-submit" title="Send">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Templates -->
    <template id="tpl-user-msg">
        <div class="message">
            <div class="message-avatar avatar-user">U</div>
            <div class="message-content"><div class="user-text"></div></div>
        </div>
    </template>

    <template id="tpl-ai-msg">
        <div class="message">
            <div class="message-avatar avatar-ai">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="message-content"><div class="ai-text"></div></div>
        </div>
    </template>

    <template id="tpl-loading">
        <div class="message loading-msg">
            <div class="message-avatar avatar-ai">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            </div>
            <div class="message-content">
                <div class="typing-indicator"><span></span><span></span><span></span></div>
            </div>
        </div>
    </template>

    <script src="index.js?v=12"></script>
</body>
</html>
